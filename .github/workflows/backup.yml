name: DB Backup

# 觸發時機：
#  1. 每日排程（順便讓 Supabase 免費專案不會因閒置而休眠）
#  2. 手動執行（Actions 頁面 → Run workflow）
#  3. repository_dispatch(type=snapshot)：由前台編輯後透過 /api/snapshot 觸發（選配）
on:
  schedule:
    - cron: '0 18 * * *'   # 每日 UTC 18:00 ≈ 台灣時間 02:00
  workflow_dispatch: {}
  repository_dispatch:
    types: [snapshot]

permissions:
  contents: write
  actions: write   # 供到期後自我停用排程

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  # 旅行結束後的截止日：到期即自動停用每日備份與防休眠，讓 Supabase 免費專案自然休眠、釋放名額
  BACKUP_CUTOFF: '2026-10-28'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查備份有效期（到期自動停用）
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%F)
          if [[ "$TODAY" > "$BACKUP_CUTOFF" ]]; then
            echo "今天 $TODAY 已超過截止日 $BACKUP_CUTOFF → 停用每日備份排程。"
            gh workflow disable "DB Backup" --repo "$GITHUB_REPOSITORY" || true
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "在有效期內（截止 $BACKUP_CUTOFF），照常備份。"
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.window.outputs.expired != 'true'
        uses: actions/checkout@v4

      - if: steps.window.outputs.expired != 'true'
        uses: actions/setup-node@v4
        with:
          # 需 22+：supabase-js 的 realtime 在 Node 20 缺少原生 WebSocket 會報錯
          node-version: 22

      - name: Install deps
        if: steps.window.outputs.expired != 'true'
        run: npm install --no-audit --no-fund

      - name: Run backup
        if: steps.window.outputs.expired != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 備份只需讀取權限，anon key 即可；還原（寫回）才需 service_role（放本機 .env）。
          # 兩者若都設，client 會優先用 service_role。
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SNAPSHOT_SOURCE: >-
            ${{ github.event_name == 'repository_dispatch' && 'edit'
              || github.event_name == 'schedule' && 'daily'
              || 'manual' }}
        run: node scripts/backup.mjs

      - name: Commit snapshot if changed
        if: steps.window.outputs.expired != 'true'
        run: |
          git config user.name "busan-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "資料無變更，不需 commit"
          else
            git commit -m "chore(backup): snapshot $(date -u +%FT%TZ) [skip ci]"
            git push
          fi
